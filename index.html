<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pneumonia Detection - DAS Medhub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f4f6f8;
        }

        h1 {
            color: #FFA500;
            display: inline;
        }

        h1 span {
            color: #008000;
        }

        #image-container {
            margin-top: 20px;
            position: relative;
            display: inline-block;
        }

        #uploaded-image {
            max-width: 300px;
            display: none;
            transition: transform 0.3s ease;
        }

        #result {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
        }

        #controls {
            margin-top: 10px;
        }

        #controls button {
            margin: 5px;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #predict-button {
            display: none;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #predict-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #demographics-form {
            display: none;
            margin-top: 20px;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            max-width: 350px;
            margin: 0 auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #demographics-form input, 
        #demographics-form button, 
        #demographics-form select {
            margin: 10px 0;
            padding: 10px;
            font-size: 14px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        #demographics-form button {
            background-color: #007BFF;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #demographics-form button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>DASmedhub Pneumonia Classification</h1> <br>
    <input type="file" id="image-upload" accept="image/*">
    <img id="uploaded-image" alt="Uploaded Image">
    <button id="predict-button" onclick="predict()">Predict</button>

    <div id="result"></div>
    <div id="azure-findings"></div>

    <form id="demographics-form">
        <h2>Patient Details</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" required>
        <br>
        <label for="id">Patient ID:</label>
        <input type="text" id="id" required>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" required>
        <br>
        <label for="gender">Gender:</label>
        <select id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <br>
        <button type="button" onclick="downloadPDF()">Download PDF</button>
    </form>

    <script>
        let model;

        async function loadModel() {
            try {
                model = await tf.loadGraphModel('model/model/model.json');
                console.log('Model loaded successfully');
            } catch (error) {
                console.error('Error loading model:', error);
            }
        }
        loadModel();

        const imageUpload = document.getElementById('image-upload');
        const uploadedImage = document.getElementById('uploaded-image');
        const predictButton = document.getElementById('predict-button');
        const resultDiv = document.getElementById('result');
        const findingsDiv = document.getElementById('azure-findings');

        imageUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            const reader = new FileReader();

            resultDiv.innerText = '';
            findingsDiv.innerText = '';

            reader.onload = function(e) {
                uploadedImage.src = e.target.result;
                uploadedImage.style.display = 'block';
                predictButton.style.display = 'inline-block';
                predictButton.disabled = false;
            };

            reader.readAsDataURL(file);
        });

        async function predict() {
            predictButton.disabled = true;
            resultDiv.innerText = 'Predicting...';

            try {
                const tensorImg = tf.browser.fromPixels(uploadedImage)
                    .resizeNearestNeighbor([150, 150])
                    .toFloat()
                    .expandDims(0)
                    .div(tf.scalar(255));

                const predictions = await model.predict(tensorImg).data();

                const isInfected = predictions[0] <= 0.5;
                const confidence = isInfected ? (1 - predictions[0]) * 100 : predictions[0] * 100;
                const result = isInfected ? 'Normal' : 'Pneumonia';

                resultDiv.innerText = `Prediction: ${result} (${confidence.toFixed(2)}% confidence)`;

                let manualFindings = '';
                if (result === 'Pneumonia') {
                    if (confidence >= 90) {
                        manualFindings = `
                            - The X-ray indicates strong evidence of pneumonia. 
                            - Observed features include significant opacities or consolidation in lung fields.
                            - Immediate medical intervention is recommended.`;
                    } else if (confidence >= 70) {
                        manualFindings = `
                            - Signs of pneumonia are evident but not highly conclusive.
                            - Slight opacities or clouding may suggest early stages of infection.
                            - Further testing and monitoring are advised.`;
                    } else {
                        manualFindings = `
                            - Minimal evidence of pneumonia detected.
                            - Observations suggest mild abnormalities, potentially non-pneumonia related.
                            - Follow-up imaging is recommended to confirm diagnosis.`;
                    }
                } else if (result === 'Normal') {
                    if (confidence >= 90) {
                        manualFindings = `
                            - The chest X-ray appears normal with no significant abnormalities detected.
                            - Clear lung fields with no signs of infection or consolidation.
                            - Routine check-ups are advised to maintain good health.`;
                    } else if (confidence >= 70) {
                        manualFindings = `
                            - The X-ray appears normal; however, the confidence is moderate.
                            - No significant findings, but further observation may be considered for precautionary measures.`;
                    } else {
                        manualFindings = `
                            - The X-ray suggests normal results, but with lower confidence.
                            - Consider additional tests if the patient exhibits symptoms.`;
                    }
                }

                findingsDiv.innerText = `Detailed Findings: ${manualFindings.trim()}`;

                document.getElementById('demographics-form').style.display = 'block';
            } catch (error) {
                console.error('Error during prediction:', error);
                resultDiv.innerText = 'Error during prediction. Please try again later.';
            }
            predictButton.disabled = false;
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;

            const name = document.getElementById('name').value;
            const id = document.getElementById('id').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;

            const pdf = new jsPDF();
            pdf.setFontSize(20);
            pdf.text('DASmedhub Pneumonia Classification', 105, 10, { align: 'center' });

            pdf.setFontSize(12);
            pdf.text(10, 30, `Name: ${name}`);
            pdf.text(10, 40, `Patient ID: ${id}`);
            pdf.text(10, 50, `Age: ${age}`);
            pdf.text(10, 60, `Gender: ${gender}`);
            pdf.text(10, 70, resultDiv.innerText);
            pdf.text(10, 80, findingsDiv.innerText, { maxWidth: 180 });

            const imgData = uploadedImage.src;
            pdf.addImage(imgData, 'JPEG', 10, 100, 180, 100);

            pdf.save('pneumonia_result.pdf');
        }
    </script>
</body>
</html>
