<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pneumonia Detection - DAS medhub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f4f6f8;
        }

        h1 {
            color: #FFA500; /* Orange for DAS */
            display: inline;
        }

        h1 span {
            color: #008000; /* Green for medhub */
        }

        #image-container {
            margin-top: 20px;
            position: relative;
            display: inline-block;
        }

        #uploaded-image {
            max-width: 300px;
            display: none;
            transition: transform 0.3s ease;
        }

        #result {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
        }

        #controls {
            margin-top: 10px;
        }

        #controls button {
            margin: 5px;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #predict-button {
            display: none;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #predict-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #demographics-form {
            display: none;
            margin-top: 20px;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-width: 300px;
            margin: 0 auto;
        }

        #demographics-form input, #demographics-form button {
            margin: 10px 0;
            padding: 10px;
            font-size: 14px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>DAS <span>medhub</span></h1>
    <h2>Pneumonia Classification from Chest X-Rays</h2>

    <input type="file" id="image-upload" accept="image/*">
    <button id="predict-button" onclick="predict()">Predict</button>

    <div id="image-container">
        <img id="uploaded-image" src="#" alt="Uploaded Image">
    </div>

    <div id="result"></div>
    <div id="azure-findings"></div>

    <form id="demographics-form">
        <h3>Enter Demographics</h3>
        <input type="text" id="name" placeholder="Name" required>
        <input type="text" id="id" placeholder="Patient ID" required>
        <input type="number" id="age" placeholder="Age" required>
        <select id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <button type="button" onclick="downloadPDF()">Download as PDF</button>
    </form>

    <script>
        let model;
        let findingsDescription = '';

        // Azure API details
        const endpoint = 'https://custom-description.cognitiveservices.azure.com/';
        const subscriptionKey = 'BeaAvJ9CHPetRqS4c1vLLTQVWDcj6IIGaz9i3mYdlsbxC1BWUlTAJQQJ99ALACYeBjFXJ3w3AAAFACOGVPO9';

        // Load TensorFlow.js model
        async function loadModel() {
            try {
                model = await tf.loadGraphModel('model/model/model.json');
                console.log('Model loaded successfully');
            } catch (error) {
                console.error('Error loading model:', error);
            }
        }
        loadModel();

        const imageUpload = document.getElementById('image-upload');
        const uploadedImage = document.getElementById('uploaded-image');
        const predictButton = document.getElementById('predict-button');
        const resultDiv = document.getElementById('result');
        const findingsDiv = document.getElementById('azure-findings');

        imageUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                uploadedImage.src = e.target.result;
                uploadedImage.style.display = 'block';
                predictButton.style.display = 'inline-block';
                predictButton.disabled = false;
            };

            reader.readAsDataURL(file);
        });

        async function predict() {
            predictButton.disabled = true;
            resultDiv.innerText = 'Predicting...';

            try {
                const tensorImg = tf.browser.fromPixels(uploadedImage)
                    .resizeNearestNeighbor([224, 224])
                    .toFloat()
                    .expandDims(0)
                    .div(tf.scalar(255));

                const predictions = await model.predict(tensorImg).data();

                const isInfected = predictions[0] <= 0.5;
                const confidence = isInfected ? (1 - predictions[0]) * 100 : predictions[0] * 100;
                const result = isInfected ? 'Normal' : 'Pneumonia';

                resultDiv.innerText = `Prediction: ${result} (${confidence.toFixed(2)}% confidence)`;

                // Get findings from Azure Vision
                await getAzureDescription(uploadedImage.src);
            } catch (error) {
                console.error('Error during prediction:', error);
                resultDiv.innerText = 'Error during prediction. Please try again later.';
            }
            predictButton.disabled = false;
        }

        async function getAzureDescription(imageData) {
            const imageBlob = await fetch(imageData).then(res => res.blob());

            const response = await fetch(endpoint + 'vision/v3.2/describe', {
                method: 'POST',
                headers: {
                    'Ocp-Apim-Subscription-Key': subscriptionKey,
                    'Content-Type': 'application/octet-stream'
                },
                body: imageBlob
            });

            const data = await response.json();

            if (data?.description?.captions?.length > 0) {
                findingsDescription = data.description.captions[0].text;
                findingsDiv.innerText = `Azure Findings: ${findingsDescription}`;
            } else {
                findingsDiv.innerText = 'No findings from Azure.';
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;

            const name = document.getElementById('name').value;
            const id = document.getElementById('id').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;

            const pdf = new jsPDF();
            pdf.text(10, 10, `Name: ${name}`);
            pdf.text(10, 20, `Patient ID: ${id}`);
            pdf.text(10, 30, `Age: ${age}`);
            pdf.text(10, 40, `Gender: ${gender}`);
            pdf.text(10, 50, resultDiv.innerText);
            pdf.text(10, 60, `Azure Findings: ${findingsDescription}`);

            const imgData = uploadedImage.src;
            pdf.addImage(imgData, 'JPEG', 10, 70, 100, 100);

            pdf.save('pneumonia_result.pdf');
        }
    </script>
</body>
</html>
